name: Korea marcap calibrated v2 clean

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow scikit-learn lightgbm
      - name: Apply bounded fast research patch
        run: |
          python research/korea_marcap_v2/patch_fast.py
      - name: Compile
        run: |
          python -m py_compile research/korea_marcap_v1/run.py research/korea_marcap_v2/run_v2.py
      - name: Run calibrated v2 research
        run: |
          python research/korea_marcap_v2/run_v2.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-marcap-v2-clean-results
          path: /tmp/korea_marcap_v2/outputs
          if-no-files-found: warn
          retention-days: 30
