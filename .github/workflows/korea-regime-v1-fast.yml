name: Korea regime v1 fast research

on:
  pull_request:
    branches:
      - master
    paths:
      - "research/korea_regime_v1/**"
      - ".github/workflows/korea-regime-v1-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance huggingface_hub hf_xet pyarrow

      - name: Reconstruct compact preregistered sweep
        run: |
          mkdir -p /tmp/korea_regime_v1_fast
          for f in research/korea_regime_v1/parts/run_part_*.txt; do
            cat "$f"
            printf '\n'
          done > /tmp/korea_regime_v1_fast/run.py
          cat > /tmp/korea_regime_v1_fast/fast.py <<'PY'
          import importlib.util
          import itertools
          import sys
          from pathlib import Path

          p = Path('/tmp/korea_regime_v1_fast/run.py')
          spec = importlib.util.spec_from_file_location('korea_regime_core', p)
          mod = importlib.util.module_from_spec(spec)
          sys.modules['korea_regime_core'] = mod
          spec.loader.exec_module(mod)

          def compact_configs():
              out = []
              for vals in itertools.product(
                  [2, 3],
                  [1, 2],
                  [1],
                  [1, 2],
                  [1.00],
                  [0.65],
                  [0.35],
                  [1.5, 2.0],
                  [True],
              ):
                  out.append(mod.Config(*vals))
              return out

          mod.build_configs = compact_configs
          mod.OUT = Path('/tmp/korea_regime_v1_fast/outputs')
          mod.OUT.mkdir(parents=True, exist_ok=True)
          mod.main()
          PY
          python -m py_compile /tmp/korea_regime_v1_fast/run.py /tmp/korea_regime_v1_fast/fast.py
          python /tmp/korea_regime_v1_fast/fast.py

      - name: Print result
        if: always()
        run: |
          if [ -f /tmp/korea_regime_v1_fast/outputs/final_result.json ]; then
            echo '===KOREA_REGIME_V1_FAST_RESULT_BEGIN==='
            cat /tmp/korea_regime_v1_fast/outputs/final_result.json
            echo '===KOREA_REGIME_V1_FAST_RESULT_END==='
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-regime-v1-fast-results
          path: /tmp/korea_regime_v1_fast/outputs
          if-no-files-found: warn
