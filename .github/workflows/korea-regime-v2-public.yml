name: Korea regime v2 guarded research

on:
  pull_request:
    branches:
      - master
    paths:
      - "research/korea_regime_v1/**"
      - ".github/workflows/korea-regime-v2-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance huggingface_hub hf_xet pyarrow

      - name: Reconstruct core and run v2
        run: |
          mkdir -p /tmp/korea_regime_v2
          for f in research/korea_regime_v1/parts/run_part_*.txt; do
            cat "$f"
            printf '\n'
          done > /tmp/korea_regime_v2/run_v1.py
          cp research/korea_regime_v1/v2.py /tmp/korea_regime_v2/v2.py
          python -m py_compile /tmp/korea_regime_v2/run_v1.py /tmp/korea_regime_v2/v2.py
          python /tmp/korea_regime_v2/v2.py

      - name: Print result
        if: always()
        run: |
          if [ -f /tmp/korea_regime_v2/outputs/v2_result.json ]; then
            echo '===KOREA_REGIME_V2_RESULT_BEGIN==='
            cat /tmp/korea_regime_v2/outputs/v2_result.json
            echo '===KOREA_REGIME_V2_RESULT_END==='
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-regime-v2-results
          path: /tmp/korea_regime_v2/outputs
          if-no-files-found: warn
