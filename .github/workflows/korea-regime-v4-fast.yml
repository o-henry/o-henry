name: Korea regime v4 fast subset

on:
  pull_request:
    branches: [master]
    paths:
      - 'research/korea_regime_v1/v4_fast.py'
      - '.github/workflows/korea-regime-v4-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance huggingface_hub hf_xet pyarrow
      - name: Reconstruct and run fast v4
        run: |
          mkdir -p /tmp/korea_regime_v4_fast
          for f in research/korea_regime_v1/parts/run_part_*.txt; do
            cat "$f"
            printf '\n'
          done > /tmp/korea_regime_v4_fast/run_v1.py
          cp research/korea_regime_v1/v4_regime_overlay.py /tmp/korea_regime_v4_fast/v4_regime_overlay.py
          cp research/korea_regime_v1/v4_fast.py /tmp/korea_regime_v4_fast/fast.py
          python -m py_compile /tmp/korea_regime_v4_fast/*.py
          python /tmp/korea_regime_v4_fast/fast.py
      - name: Print result
        if: always()
        run: |
          if [ -f /tmp/korea_regime_v4_fast/outputs/v4_result.json ]; then
            cat /tmp/korea_regime_v4_fast/outputs/v4_result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-regime-v4-fast-results
          path: /tmp/korea_regime_v4_fast/outputs
