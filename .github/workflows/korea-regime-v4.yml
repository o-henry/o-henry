name: Korea regime v4 overlay cash defense

on:
  pull_request:
    branches: [master]
    paths:
      - 'research/korea_regime_v1/v4_regime_overlay.py'
      - '.github/workflows/korea-regime-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance huggingface_hub hf_xet pyarrow
      - name: Reconstruct core and run v4
        run: |
          mkdir -p /tmp/korea_regime_v4
          for f in research/korea_regime_v1/parts/run_part_*.txt; do
            cat "$f"
            printf '\n'
          done > /tmp/korea_regime_v4/run_v1.py
          cp research/korea_regime_v1/v4_regime_overlay.py /tmp/korea_regime_v4/v4.py
          python -m py_compile /tmp/korea_regime_v4/run_v1.py /tmp/korea_regime_v4/v4.py
          python /tmp/korea_regime_v4/v4.py
      - name: Print result
        if: always()
        run: |
          if [ -f /tmp/korea_regime_v4/outputs/v4_result.json ]; then
            echo '===KOREA_V4_RESULT_BEGIN==='
            cat /tmp/korea_regime_v4/outputs/v4_result.json
            echo '===KOREA_V4_RESULT_END==='
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korea-regime-v4-results
          path: /tmp/korea_regime_v4/outputs
